name: REST-AI-Completions-v1
type: template
description: API template for AI-Completions
features:
  - ../features/ai-completions.yaml
  - ../features/ai-auth.yaml
  - ../features/auth-external-token.yaml
parameters:
  - name: EntraJwksUri
    displayName: Entra JwksUri
    description: Configuration input for Microsoft Entra ID JWKS URI.
    default: https://login.microsoftonline.com/common/discovery/v2.0/keys
endpoints:
  - name: completions
    basePath: /v1/chat/completions
    routes:
      - name: route-google-eu
        target: gcloud-eu
        condition: target.route = "gcloud-eu"
      - name: route-google
        target: gcloud
        condition: target.route = "gcloud"
      - name: route-openai
        target: openai
        condition: target.route = "openai"
      - name: route-anthropic
        target: anthropic
        condition: target.route = "anthropic"
      - name: default
        target: gcloud
targets:
  - name: anthropic
    url: https://api.anthropic.com
  - name: gcloud-eu
    url: https://aiplatform.eu.rep.googleapis.com/v1/projects/{organization.name}/locations/eu/endpoints/openapi/chat/completions
  - name: gcloud
    url: https://aiplatform.googleapis.com/v1/projects/{organization.name}/locations/global/endpoints/openapi/chat/completions
  - name: openai
    url: https://api.openai.com
