# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/apigee.schema.json
name: REST-AI-Chat-Completions
type: template
description: API template for REST-AI-Chat-Completions
gateway: apigee
schemaVersion: 1.0.0
features:
  - ai-chat-completions.yaml
parameters:
  - name: ModelRouting
    displayName: ModelRouting
    description: Configuration input for ModelRouting
    default: "true"
    examples: []
    maps: {}
  - name: ModelRoutingKey
    displayName: ModelRoutingKey
    description: Configuration input for ModelRoutingKey
    default: ModelRoutingText
    examples: []
    maps: {}
endpoints:
  - name: completions
    basePath: /v1/chat/completions
    routes:
      - name: route-googlecloud
        condition: target.route = "googlecloud"
        target: googlecloud
      - name: route-googlecloud-oai
        condition: target.route = "googlecloud-oai"
        target: googlecloud-oai
      - name: route-openai
        condition: target.route = "openai"
        target: openai
      - name: route-anthropic
        condition: target.route = "anthropic"
        target: anthropic
      - name: default
        target: googlecloud
targets:
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{organization.name}/locations/global/endpoints/openapi/chat/completions
  - name: anthropic
    url: https://api.anthropic.com
  - name: openai
    url: https://api.openai.com
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{organization.name}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
