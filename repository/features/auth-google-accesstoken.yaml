name: auth-google-accesstoken
displayName: Google Access Token
type: feature
description: The Google Access Token feature validates a Google Access Token from the Authorization header, checks user/group key configurations, caches token & user details, and exchanges for API access.
documentation: ""
priority: 5
categories:
  - llm
  - ai
parameters: []
defaultEndpoint:
  name: default
  basePath: /google-accesstoken
  routes:
    - name: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: KVM-LoadConfig
        - name: AM-RemoveGroupHeader
          condition: request.header.x-ai-group != null
        - name: EV-ExtractBearerToken
          condition: request.header.Authorization != null AND request.header.Authorization
            Matches "Bearer ya29.*"
        - name: LC-LookupTokenCache
          condition: google.raw_access_token != null
        - name: JS-ParseCachedUser
          condition: google.token.cached_user != null
        - name: SC-ValidateGoogleToken
          condition: google.raw_access_token != null AND google.token_cached != "true"
        - name: JS-ParseGoogleToken
          condition: google.raw_access_token != null AND google.token_cached != "true"
        - name: KVM-GetUserKeyByEmail
          condition: google.token.email != null AND google.token_cached != "true"
        - name: KVM-GetGroupsByEmail
          condition: user.groups_kvm_key != null AND google.token_cached != "true"
        - name: SC-GetGoogleGroups
          condition: google.token.email != null AND google.token.groups == null AND
            ai.groupsLookup != "FALSE" AND google.token_cached != "true"
        - name: JS-ParseGoogleGroups
          condition: google.token.email != null AND google.token.groups == null AND
            groupsResponse.content != null AND google.token_cached != "true"
        - name: KVM-SaveGroupsByEmail
          condition: google.token.email != null AND google.groups_fetched == "true" AND
            google.token_cached != "true"
        - name: JS-ProcessUser
          condition: google.token.valid == "true" AND google.token_cached != "true"
        - name: PC-PopulateTokenCache
          condition: google.raw_access_token != null AND google.token.cached_user != null AND google.token_cached != "true"
    - name: PostFlow
      mode: Response
      steps: []
  faultRules: []
endpoints: []
targets: []
policies:
  - name: AM-RemoveGroupHeader
    type: AssignMessage
    content:
      assignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-RemoveGroupHeader
        displayName: AM-RemoveGroupHeader
        properties: {}
        remove:
          headers:
            header:
              metadata:
                name: x-ai-group
        ignoreUnresolvedVariables: "true"
        assignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
  - name: EV-ExtractBearerToken
    type: ExtractVariables
    content:
      extractVariables:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: EV-ExtractBearerToken
        displayName: EV-ExtractBearerToken
        header:
          metadata:
            name: Authorization
          pattern:
            metadata:
              ignoreCase: "true"
            value: Bearer {google.raw_access_token}
        ignoreUnresolvedVariables: "true"
  - name: LC-LookupTokenCache
    type: LookupCache
    content:
      lookupCache:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: LC-LookupTokenCache
        displayName: LC-LookupTokenCache
        properties: {}
        cacheKey:
          keyFragment:
            - value: google_token
            - metadata:
                ref: google.raw_access_token
        assignTo: google.token.cached_user
  - name: JS-ParseCachedUser
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseCachedUser
        displayName: JS-ParseCachedUser
        properties: {}
        source: |
          var cachedUserStr = context.getVariable("google.token.cached_user");
          if (cachedUserStr) {
            try {
              var cached = JSON.parse(cachedUserStr);
              if (cached.email) context.setVariable("google.token.email", cached.email);
              if (cached.groups) context.setVariable("google.token.groups", cached.groups);
              if (cached.user_key) context.setVariable("google.user_key", cached.user_key);
              if (cached.api_key) context.setVariable("request.header.x-ai-key", cached.api_key);
              if (cached.group) context.setVariable("request.header.x-ai-group", cached.group);
              context.setVariable("google.token.valid", "true");
              context.setVariable("google.token_cached", "true");
              print("User info successfully restored from cache for " + cached.email);
            } catch (e) {
              print("Failed to parse cached user data: " + e);
            }
          }
  - name: JS-ParseGoogleGroups
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseGoogleGroups
        displayName: JS-ParseGoogleGroups
        properties: {}
        source: |
          var responseContent = context.getVariable("groupsResponse.content");
          if (responseContent) {
            try {
              var groupsData = JSON.parse(responseContent);
              var groupNames = [];
              if (groupsData.memberships) {
                for (var i = 0; i < groupsData.memberships.length; i++) {
                  var m = groupsData.memberships[i];
                  if (m.groupKey && m.groupKey.id) {
                    groupNames.push(m.groupKey.id);
                  }
                }
              }
              var groupsStr = groupNames.join(",");
              context.setVariable("google.token.groups", groupsStr);
              context.setVariable("google.groups_fetched", "true");
            } catch (e) {
              print("Failed to parse Google groups response: " + e);
            }
          }
  - name: JS-ParseGoogleToken
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseGoogleToken
        displayName: JS-ParseGoogleToken
        properties: {}
        source: |
          var responseCode = context.getVariable("tokenInfoResponse.status.code");
          var responseContent = context.getVariable("tokenInfoResponse.content");

          if (responseCode == "200" && responseContent) {
            try {
              var tokenInfo = JSON.parse(responseContent);
              if (tokenInfo.email) context.setVariable("google.token.email", tokenInfo.email);
              if (tokenInfo.email_verified) context.setVariable("google.token.email_verified", tokenInfo.email_verified);
              if (tokenInfo.scope) context.setVariable("google.token.scope", tokenInfo.scope);
              if (tokenInfo.exp) context.setVariable("google.token.expires_in", tokenInfo.expires_in || tokenInfo.exp);
              if (tokenInfo.aud) context.setVariable("google.token.aud", tokenInfo.aud);
              if (tokenInfo.sub) context.setVariable("google.token.sub", tokenInfo.sub);
              if (tokenInfo.azp) context.setVariable("google.token.azp", tokenInfo.azp);
              context.setVariable("google.token.valid", "true");
              context.setVariable("user.groups_kvm_key", "groups." + tokenInfo.email);
            } catch (e) {
              context.setVariable("google.token.valid", "false");
              context.setVariable("response.status.code", 401);
              throw "Invalid Google OAuth Token Response";
            }
          } else {
            context.setVariable("google.token.valid", "false");
            context.setVariable("response.status.code", 401);
            throw "Invalid Google OAuth Token";
          }
  - name: KVM-GetUserKeyByEmail
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-GetUserKeyByEmail
          mapIdentifier: AI-Users
        displayName: KVM-GetUserKeyByEmail
        properties: {}
        get:
          metadata:
            assignTo: google.user_key
            index: "1"
          key:
            parameter:
              metadata:
                ref: google.token.email
        scope: environment
  - name: JS-ProcessUser
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessUser
        displayName: JS-ProcessUser
        properties: {}
        source: |
          var userKey = context.getVariable("google.user_key");
          var resolvedKey = null;
          var matchedGroup = null;

          if (userKey && userKey.trim() !== "") {
            resolvedKey = userKey.trim();
            print("Found direct user key for email, using as x-ai-key...");
          } else {
            var groupData = context.getVariable("google.token.groups");
            if (groupData) {
              var groupArray = groupData.split(",");
              var groupCredentials = context.getVariable("ai.groups");
              if (groupCredentials) {
                try {
                  var groupCredentialsObject = JSON.parse(groupCredentials);
                  for (var i = 0; i < groupArray.length; i++) {
                    var grp = groupArray[i].trim();
                    if (groupCredentialsObject[grp]) {
                      resolvedKey = groupCredentialsObject[grp];
                      matchedGroup = grp;
                      print("Found group credential, setting as header...");
                      break;
                    }
                  }
                } catch(e) {
                  print("Error parsing group credential data: " + e);
                }
              }
              if (!matchedGroup && groupArray.length > 0 && groupArray[0].trim() !== "") {
                matchedGroup = groupArray[0].trim();
              }
            }
          }

          if (!matchedGroup) {
            var emailVal = context.getVariable("google.token.email");
            if (emailVal) matchedGroup = emailVal;
          }

          if (resolvedKey) {
            context.setVariable("request.header.x-ai-key", resolvedKey);
          }
          if (matchedGroup) {
            context.setVariable("request.header.x-ai-group", matchedGroup);
          }

          var email = context.getVariable("google.token.email") || "";
          var groups = context.getVariable("google.token.groups") || "";
          var userKeyVal = context.getVariable("google.user_key") || "";
          var apiKey = context.getVariable("request.header.x-ai-key") || "";
          var groupHeader = context.getVariable("request.header.x-ai-group") || "";

          var cacheObject = {
            email: email,
            groups: groups,
            user_key: userKeyVal,
            api_key: apiKey,
            group: groupHeader
          };
          context.setVariable("google.token.cached_user", JSON.stringify(cacheObject));
          print("Prepared cached_user payload for token cache: " + JSON.stringify(cacheObject));
  - name: PC-PopulateTokenCache
    type: PopulateCache
    content:
      populateCache:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: PC-PopulateTokenCache
        displayName: PC-PopulateTokenCache
        properties: {}
        cacheKey:
          keyFragment:
            - value: google_token
            - metadata:
                ref: google.raw_access_token
        source: google.token.cached_user
        expirySettings:
          timeoutInSec: "3600"
  - name: KVM-GetGroupsByEmail
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-GetGroupsByEmail
          mapIdentifier: AI-Users
        displayName: KVM-GetGroupsByEmail
        properties: {}
        get:
          metadata:
            assignTo: google.token.groups
            index: "1"
          key:
            parameter:
              metadata:
                ref: user.groups_kvm_key
        scope: environment
  - name: KVM-SaveGroupsByEmail
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-SaveGroupsByEmail
          mapIdentifier: AI-Users
        displayName: KVM-SaveGroupsByEmail
        properties: {}
        put:
          setValue:
            metadata:
              ref: google.token.groups
          key:
            parameter:
              metadata:
                ref: user.groups_kvm_key
        scope: environment
  - name: SC-GetGoogleGroups
    type: ServiceCallout
    content:
      serviceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-GetGoogleGroups
        displayName: SC-GetGoogleGroups
        properties: {}
        request:
          variable: groupsRequest
          ignoreUnresolvedVariables: "true"
        response: groupsResponse
        httpTargetConnection:
          properties: {}
          url: https://cloudidentity.googleapis.com/v1/groups/-/memberships:searchDirectGroups?query=member_key_id=='{google.token.email}'
          authentication:
            googleAccessToken:
              scopes:
                scope: https://www.googleapis.com/auth/cloud-identity.groups.readonly
  - name: SC-ValidateGoogleToken
    type: ServiceCallout
    content:
      serviceCallout:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: SC-ValidateGoogleToken
        displayName: SC-ValidateGoogleToken
        properties: {}
        request:
          variable: tokenInfoRequest
          ignoreUnresolvedVariables: "false"
        response: tokenInfoResponse
        httpTargetConnection:
          properties: {}
          url: https://oauth2.googleapis.com/tokeninfo?access_token={google.raw_access_token}
  - name: KVM-LoadConfig
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: KVM-LoadConfig
          mapIdentifier: AI-Config
        displayName: KVM-LoadConfig
        properties: {}
        exclusiveCache: "false"
        expiryTimeInSecs: "10"
        get:
          - metadata:
              assignTo: ai.failoverModel
              index: "1"
            key:
              parameter: FailoverModel
          - metadata:
              assignTo: ai.prices
              index: "1"
            key:
              parameter: Prices
          - metadata:
              assignTo: ai.groupsLookup
              index: "1"
            key:
              parameter: GroupsLookup
          - metadata:
              assignTo: ai.groups
              index: "1"
            key:
              parameter: Groups
        scope: environment
resources: []
tests: []
