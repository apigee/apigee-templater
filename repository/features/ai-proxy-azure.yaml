name: ai-proxy-azure
displayName: ai-proxy-azure
type: feature
description: Proxy for Azure Foundry models.
documentation: ""
categories: []
parameters:
  - name: BasePath
    paths:
      - $.endpoints[:1].basePath
    description: The base path to offer the proxy on.
    default: /azure
    examples:
      - /llm
      - /models
  - name: AzureResource
    description: The Azure Resource to call the models with.
    default: my-resource
endpoints:
  - name: azure
    basePath: /azure
    routes:
      - name: azure
        target: azure
    flows: []
    faultRules: []
targets:
  - name: azure
    url: https://{AzureResource}.openai.azure.com
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://{AzureResource}.openai.azure.com
policies: []
resources: []
tests: []
