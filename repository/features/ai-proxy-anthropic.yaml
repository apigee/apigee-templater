    paths:
      - $.endpoints[:1].basePath
    description: The base path to offer the proxy on.
    default: /anthropic
    examples:
      - /llm
      - /models
endpoints:
  - name: anthropic
    basePath: /anthropic
    routes:
      - name: anthropic
        target: anthropic
    flows: []
    faultRules: []
targets:
  - name: anthropic
    url: https://api.anthropic.com
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://api.anthropic.com
policies: []
resources: []
tests: []
