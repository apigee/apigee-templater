name: auth-external-key
displayName: External Key Auth
type: feature
description: Validates external API keys (Anthropic sk-ant-*, OpenAI Authorization Bearer sk-*/sk-proj-*, Gemini x-goog-api-key), resolves groups and credentials from AI-Users and AI-Config KVMs, caches user/key details, and sets resolved key in x-ai-key and group in x-ai-group.
documentation: ""
priority: 5
categories:
  - llm
  - ai
parameters: []
defaultEndpoint:
  name: default
  basePath: /external-key
  routes:
    - name: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: KVM-LoadConfig
        - name: AM-RemoveGroupHeader
          condition: request.header.x-ai-group != null
        - name: JS-ExtractExternalKey
        - name: LC-LookupTokenCache
          condition: external.raw_api_key != null
        - name: JS-ParseCachedUser
          condition: external.key.cached_user != null
        - name: KVM-GetGroupsByKey
          condition: external.raw_api_key != null AND external.key_cached != "true"
        - name: JS-ProcessUser
          condition: external.raw_api_key != null AND external.key_cached != "true"
        - name: PC-PopulateTokenCache
          condition: external.raw_api_key != null AND external.key.cached_user != null AND external.key_cached != "true"
    - name: PostFlow
      mode: Response
      steps: []
  faultRules: []
endpoints: []
targets: []
policies:
  - name: AM-RemoveGroupHeader
    type: AssignMessage
    content:
      assignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-RemoveGroupHeader
        displayName: AM-RemoveGroupHeader
        properties: {}
        remove:
          headers:
            header:
              metadata:
                name: x-ai-group
        ignoreUnresolvedVariables: "true"
        assignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
  - name: JS-ExtractExternalKey
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractExternalKey
        displayName: JS-ExtractExternalKey
        properties: {}
        source: |
          var xApiKey = context.getVariable("request.header.x-api-key");
          var authHeader = context.getVariable("request.header.Authorization");
          var googHeader = context.getVariable("request.header.x-goog-api-key");
          var keyParam = context.getVariable("request.queryparam.key");
          var rawKey = null;
          var provider = null;

          // 1. Anthropic: x-api-key starting with sk-ant-
          if (xApiKey && xApiKey.trim().indexOf("sk-ant-") === 0) {
            rawKey = xApiKey.trim();
            provider = "anthropic";
          } else if (authHeader) {
            var authTrim = authHeader.trim();
            if (authTrim.indexOf("Bearer sk-ant-") === 0) {
              rawKey = authTrim.substring(7).trim();
              provider = "anthropic";
            } else if (authTrim.indexOf("sk-ant-") === 0) {
              rawKey = authTrim;
              provider = "anthropic";
            }
          }

          // 2. OpenAI: Authorization Bearer starting with sk- or sk-proj-
          if (!rawKey && authHeader) {
            var authTrim = authHeader.trim();
            var token = authTrim;
            if (authTrim.indexOf("Bearer ") === 0) {
              token = authTrim.substring(7).trim();
            }
            if (token.indexOf("sk-proj-") === 0 || (token.indexOf("sk-") === 0 && token.indexOf("sk-ant-") !== 0)) {
              rawKey = token;
              provider = "openai";
            }
          }
          if (!rawKey && xApiKey) {
            var xTrim = xApiKey.trim();
            if (xTrim.indexOf("sk-proj-") === 0 || (xTrim.indexOf("sk-") === 0 && xTrim.indexOf("sk-ant-") !== 0)) {
              rawKey = xTrim;
              provider = "openai";
            }
          }

          // 3. Gemini: x-goog-api-key
          if (!rawKey && googHeader && googHeader.trim() !== "") {
            rawKey = googHeader.trim();
            provider = "gemini";
          }
          if (!rawKey && keyParam && keyParam.trim() !== "") {
            rawKey = keyParam.trim();
            provider = "gemini";
          }
          if (!rawKey && xApiKey && xApiKey.trim().indexOf("AIza") === 0) {
            rawKey = xApiKey.trim();
            provider = "gemini";
          }

          if (rawKey) {
            context.setVariable("external.raw_api_key", rawKey);
            if (provider) context.setVariable("external.provider", provider);
            context.setVariable("external.groups_kvm_key", "groups." + rawKey);
          }
  - name: LC-LookupTokenCache
    type: LookupCache
    content:
      lookupCache:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: LC-LookupTokenCache
        displayName: LC-LookupTokenCache
        properties: {}
        cacheKey:
          keyFragment:
            - value: external_key
            - metadata:
                ref: external.raw_api_key
        assignTo: external.key.cached_user
  - name: JS-ParseCachedUser
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseCachedUser
        displayName: JS-ParseCachedUser
        properties: {}
        source: |
          var cachedUserStr = context.getVariable("external.key.cached_user");
          if (cachedUserStr) {
            try {
              var cached = JSON.parse(cachedUserStr);
              if (cached.raw_api_key) context.setVariable("external.raw_api_key", cached.raw_api_key);
              if (cached.provider) context.setVariable("external.provider", cached.provider);
              if (cached.groups) context.setVariable("external.key.groups", cached.groups);
              if (cached.api_key) context.setVariable("request.header.x-ai-key", cached.api_key);
              if (cached.group) context.setVariable("request.header.x-ai-group", cached.group);
              context.setVariable("external.key_cached", "true");
              print("External user info successfully restored from cache");
            } catch (e) {
              print("Failed to parse cached External data: " + e);
            }
          }
  - name: KVM-GetGroupsByKey
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-GetGroupsByKey
          mapIdentifier: AI-Users
        displayName: KVM-GetGroupsByKey
        properties: {}
        get:
          metadata:
            assignTo: external.key.groups
            index: "1"
          key:
            parameter:
              metadata:
                ref: external.groups_kvm_key
        scope: environment
  - name: JS-ProcessUser
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessUser
        displayName: JS-ProcessUser
        properties: {}
        source: |
          var groupData = context.getVariable("external.key.groups");
          var resolvedKey = null;
          var matchedGroup = null;

          if (groupData) {
            var groupArray = groupData.split(",");
            var groupCredentials = context.getVariable("ai.groups");
            if (groupCredentials) {
              try {
                var groupCredentialsObject = JSON.parse(groupCredentials);
                for (var i = 0; i < groupArray.length; i++) {
                  var grp = groupArray[i].trim();
                  if (groupCredentialsObject[grp]) {
                    resolvedKey = groupCredentialsObject[grp];
                    matchedGroup = grp;
                    print("Found group credential for external key, setting as x-ai-key...");
                    break;
                  }
                }
              } catch(e) {
                print("Error parsing group credential data: " + e);
              }
            }
            if (!matchedGroup && groupArray.length > 0 && groupArray[0].trim() !== "") {
              matchedGroup = groupArray[0].trim();
            }
          }

          if (!resolvedKey) {
            var rawKey = context.getVariable("external.raw_api_key");
            if (rawKey) resolvedKey = rawKey;
          }

          if (resolvedKey) {
            context.setVariable("request.header.x-ai-key", resolvedKey);
          }
          if (matchedGroup) {
            context.setVariable("request.header.x-ai-group", matchedGroup);
          }

          var rawApiKey = context.getVariable("external.raw_api_key") || "";
          var provider = context.getVariable("external.provider") || "";
          var groups = context.getVariable("external.key.groups") || "";
          var apiKey = context.getVariable("request.header.x-ai-key") || "";
          var groupHeader = context.getVariable("request.header.x-ai-group") || "";

          var cacheObject = {
            raw_api_key: rawApiKey,
            provider: provider,
            groups: groups,
            api_key: apiKey,
            group: groupHeader
          };
          context.setVariable("external.key.cached_user", JSON.stringify(cacheObject));
  - name: PC-PopulateTokenCache
    type: PopulateCache
    content:
      populateCache:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: PC-PopulateTokenCache
        displayName: PC-PopulateTokenCache
        properties: {}
        cacheKey:
          keyFragment:
            - value: external_key
            - metadata:
                ref: external.raw_api_key
        source: external.key.cached_user
        expirySettings:
          timeoutInSec: "3600"
  - name: KVM-LoadConfig
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: KVM-LoadConfig
          mapIdentifier: AI-Config
        displayName: KVM-LoadConfig
        properties: {}
        exclusiveCache: "false"
        expiryTimeInSecs: "10"
        get:
          - metadata:
              assignTo: ai.failoverModel
            key:
              parameter: FailoverModel
          - metadata:
              assignTo: ai.prices
            key:
              parameter: PriceList
          - metadata:
              assignTo: ai.groupsLookup
            key:
              parameter: GroupsLookup
          - metadata:
              assignTo: ai.groups
              index: "1"
            key:
              parameter: Groups
        scope: environment
resources: []
tests: []
