name: ai-models
displayName: AI Models
type: feature
description: The proxy feature offers the /models endpoint, for users to query
  which models are available to them.
documentation: ""
priority: 1
categories:
  - llm
  - ai
parameters: []
defaultEndpoint:
  name: default
  basePath: /v1/models
  routes:
    - name: route-models
  flows:
    - name: PostFlow
      mode: Response
      steps:
        - name: JS-GetModelList
    - name: PreFlow
      mode: Request
      steps: []
  faultRules: []
endpoints: []
targets: []
policies:
  - name: JS-GetModelList
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-GetModelList
        displayName: JS-GetModelList
        properties: {}
        includeUrl: jsc://ai-functions.js
        source: |
          
          var configs = context.getVariable("verifyapikey.VA-VerifyKey.apiproduct.developer.llmQuota.filteredConfigs");
          var modelList = getModelList(configs);
          response.content = JSON.stringify(modelList);
          context.setVariable("response.header.Content-Type", "application/json");
resources: []
tests: []
