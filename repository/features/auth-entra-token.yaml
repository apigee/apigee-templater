name: auth-entra-token
displayName: Microsoft Entra ID Token Feature
type: feature
description: Generates an OAuth 2.0 access token from Microsoft Entra ID (Azure AD) using Client Credentials loaded from KVM AI-Secrets.
documentation: |
  This feature loads Microsoft Entra ID client credentials (`Entra_ClientId`, `Entra_Secret`, `Entra_Scope`, `Entra_TenantId`) from the `AI-Secrets` KVM and exchanges them for an OAuth 2.0 access token from Entra ID.

  **Prerequisites**:
  - Configure the KVM `AI-Secrets` in your environment with keys:
    - `Entra_ClientId`
    - `Entra_Secret`
    - `Entra_Scope` (e.g. `https://graph.microsoft.com/.default`)
    - `Entra_TenantId` (e.g. Directory/Tenant ID GUID or `common`)
categories:
  - auth
  - ai
parameters:
  - name: EntraTenantId
    displayName: Entra Tenant ID
    description: Fallback Microsoft Entra ID Directory (Tenant) ID or "common".
    default: "common"
    examples:
      - "common"
      - "00000000-0000-0000-0000-000000000000"
  - name: EntraScope
    displayName: Entra Scope
    description: Fallback scope to request from Microsoft Entra ID.
    default: "https://graph.microsoft.com/.default"
    examples:
      - "https://graph.microsoft.com/.default"
  - name: EntraClientId
    displayName: Entra Client ID
    description: Fallback Client ID configured in property set.
    default: ""
  - name: EntraClientSecret
    displayName: Entra Client Secret
    description: Fallback Client Secret configured in property set.
    default: ""
endpoints:
  - name: entra
    basePath: /auth/entra/token
    routes:
      - name: entra
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: KVM-LoadSecrets
          - name: JS-ParseTokenRequest
          - name: SC-GetEntraToken
            condition: entra.clientId != null AND entra.clientSecret != null
      - name: PostFlow
        mode: Response
        steps:
          - name: JS-ProcessTokenResponse
    faultRules: []
targets: []
policies:
  - name: KVM-LoadSecrets
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-LoadSecrets
          mapIdentifier: AI-Secrets
        displayName: KVM-LoadSecrets
        properties: {}
        exclusiveCache: "false"
        expiryTimeInSecs: "300"
        get:
          - metadata:
              assignTo: private.entra_client_id
              index: "1"
            key:
              parameter: Entra_ClientId
          - metadata:
              assignTo: private.entra_secret
              index: "1"
            key:
              parameter: Entra_Secret
          - metadata:
              assignTo: private.entra_scope
              index: "1"
            key:
              parameter: Entra_Scope
          - metadata:
              assignTo: private.entra_tenant_id
              index: "1"
            key:
              parameter: Entra_TenantId
        scope: environment
  - name: JS-ParseTokenRequest
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseTokenRequest
        displayName: JS-ParseTokenRequest
        properties: {}
        source: |
          var reqContent = request.content ? request.content.asString : "";
          var reqJson = null;
          try {
            reqJson = request.content.asJSON;
          } catch (e) {
            if (reqContent && reqContent.trim().indexOf("{") === 0) {
              try {
                reqJson = JSON.parse(reqContent);
              } catch (err) {}
            }
          }

          var clientId = context.getVariable("private.entra_client_id") ||
                         context.getVariable("request.header.x-client-id") ||
                         context.getVariable("request.formparam.client_id") ||
                         (reqJson ? reqJson.client_id : null) ||
                         context.getVariable("propertyset.auth.EntraClientId") ||
                         context.getVariable("propertyset.EntraClientId");

          var clientSecret = context.getVariable("private.entra_secret") ||
                             context.getVariable("request.header.x-client-secret") ||
                             context.getVariable("request.formparam.client_secret") ||
                             (reqJson ? reqJson.client_secret : null) ||
                             context.getVariable("propertyset.auth.EntraClientSecret") ||
                             context.getVariable("propertyset.EntraClientSecret");

          var tenantId = context.getVariable("private.entra_tenant_id") ||
                         context.getVariable("request.header.x-tenant-id") ||
                         context.getVariable("request.formparam.tenant_id") ||
                         (reqJson ? reqJson.tenant_id : null) ||
                         context.getVariable("propertyset.auth.EntraTenantId") ||
                         context.getVariable("propertyset.EntraTenantId") ||
                         "common";

          var scope = context.getVariable("private.entra_scope") ||
                      context.getVariable("request.header.x-scope") ||
                      context.getVariable("request.formparam.scope") ||
                      (reqJson ? reqJson.scope : null) ||
                      context.getVariable("propertyset.auth.EntraScope") ||
                      context.getVariable("propertyset.EntraScope") ||
                      "https://graph.microsoft.com/.default";

          var grantType = context.getVariable("request.formparam.grant_type") ||
                          (reqJson ? reqJson.grant_type : null) ||
                          "client_credentials";

          context.setVariable("entra.tenantId", tenantId);
          context.setVariable("entra.clientId", clientId);
          context.setVariable("entra.clientSecret", clientSecret);
          context.setVariable("entra.scope", scope);

          var body = "grant_type=" + encodeURIComponent(grantType) +
                     "&client_id=" + encodeURIComponent(clientId || "") +
                     "&client_secret=" + encodeURIComponent(clientSecret || "") +
                     "&scope=" + encodeURIComponent(scope || "");

          context.setVariable("entra.tokenRequestBody", body);
  - name: SC-GetEntraToken
    type: ServiceCallout
    content:
      serviceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-GetEntraToken
        displayName: SC-GetEntraToken
        properties: {}
        request:
          metadata:
            clearPayload: "true"
            variable: entraTokenRequest
          ignoreUnresolvedVariables: "false"
          set:
            headers:
              header:
                - metadata:
                    name: Content-Type
                  value: application/x-www-form-urlencoded
            verb: POST
            payload:
              metadata:
                contentType: application/x-www-form-urlencoded
              value: "{entra.tokenRequestBody}"
        response: entraTokenResponse
        httpTargetConnection:
          properties: {}
          url: https://login.microsoftonline.com/{entra.tenantId}/oauth2/v2.0/token
  - name: JS-ProcessTokenResponse
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessTokenResponse
        displayName: JS-ProcessTokenResponse
        properties: {}
        source: |
          var responseCode = context.getVariable("entraTokenResponse.status.code");
          var responseContent = context.getVariable("entraTokenResponse.content");

          if (responseContent) {
            try {
              var tokenData = JSON.parse(responseContent);
              if (tokenData.access_token) {
                context.setVariable("entra.access_token", tokenData.access_token);
                context.setVariable("entra.token_type", tokenData.token_type || "Bearer");
                context.setVariable("entra.expires_in", tokenData.expires_in);
              }
            } catch (e) {
              print("Error parsing Entra token response: " + e);
            }
            context.setVariable("response.content", responseContent);
            context.setVariable("response.header.Content-Type", "application/json");
            if (responseCode) {
              context.setVariable("response.status.code", responseCode);
            }
          } else {
            var errorObj = {
              error: "invalid_request",
              error_description: "Failed to receive token from Microsoft Entra ID. Please check KVM AI-Secrets credentials."
            };
            context.setVariable("response.content", JSON.stringify(errorObj));
            context.setVariable("response.header.Content-Type", "application/json");
            context.setVariable("response.status.code", "400");
          }
resources:
  - name: auth.properties
    type: properties
    content: |
      EntraTenantId={EntraTenantId}
      EntraScope={EntraScope}
      EntraClientId={EntraClientId}
      EntraClientSecret={EntraClientSecret}
tests: []
