name: auth-external-token
displayName: External Access Token Auth
type: feature
description: Validates Google OAuth and Microsoft Entra ID access tokens from the Authorization header, retrieves user/group key configurations from KVM or identity APIs, caches user/token details, and sets x-ai-key and x-ai-group headers.
documentation: ""
priority: 5
categories:
  - llm
  - ai
parameters:
  - name: EntraJwksUri
    displayName: Entra JwksUri
    description: Configuration input for Microsoft Entra ID JWKS URI.
    default: https://login.microsoftonline.com/common/discovery/v2.0/keys
defaultEndpoint:
  name: default
  basePath: /external-token
  routes:
    - name: default
  flows:
    - name: PreFlow
      mode: Request
      steps:
        - name: KVM-LoadConfig
        - name: AM-RemoveGroupHeader
          condition: request.header.x-ai-group != null
        - name: JS-ExtractToken
        - name: LC-LookupTokenCache
          condition: token.raw_access_token != null
        - name: JS-ParseCachedUser
          condition: token.cached_user != null
        - name: SC-ValidateGoogleToken
          condition: token.type == "google" AND token.raw_access_token != null AND token.cached != "true"
        - name: JS-ParseGoogleToken
          condition: token.type == "google" AND token.raw_access_token != null AND token.cached != "true"
        - name: VJ-VerifyEntraToken
          condition: token.type == "microsoft" AND token.raw_access_token != null AND token.cached != "true"
        - name: JS-ParseEntraToken
          condition: token.type == "microsoft" AND token.raw_access_token != null AND token.cached != "true"
        - name: KVM-GetUserKeyByEmail
          condition: token.email != null AND token.cached != "true"
        - name: KVM-GetGroupsByEmail
          condition: user.groups_kvm_key != null AND token.cached != "true"
        - name: SC-GetGoogleGroups
          condition: token.type == "google" AND token.email != null AND token.groups == null AND ai.groupsLookup != "FALSE" AND token.cached != "true"
        - name: JS-ParseGoogleGroups
          condition: token.type == "google" AND token.email != null AND token.groups == null AND groupsResponse.content != null AND token.cached != "true"
        - name: SC-GetEntraGroups
          condition: token.type == "microsoft" AND token.email != null AND token.groups == null AND ai.groupsLookup != "FALSE" AND token.cached != "true"
        - name: JS-ParseEntraGroups
          condition: token.type == "microsoft" AND token.email != null AND token.groups == null AND groupsResponse.content != null AND token.cached != "true"
        - name: KVM-SaveGroupsByEmail
          condition: token.email != null AND token.groups_fetched == "true" AND token.cached != "true"
        - name: JS-ProcessUser
          condition: token.valid == "true" AND token.cached != "true"
        - name: PC-PopulateTokenCache
          condition: token.raw_access_token != null AND token.cached_user != null AND token.cached != "true"
    - name: PostFlow
      mode: Response
      steps: []
  faultRules: []
endpoints: []
targets: []
policies:
  - name: AM-RemoveGroupHeader
    type: AssignMessage
    content:
      assignMessage:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: AM-RemoveGroupHeader
        displayName: AM-RemoveGroupHeader
        properties: {}
        remove:
          headers:
            header:
              metadata:
                name: x-ai-group
        ignoreUnresolvedVariables: "true"
        assignTo:
          metadata:
            createNew: "false"
            transport: http
            type: request
  - name: JS-ExtractToken
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ExtractToken
        displayName: JS-ExtractToken
        properties: {}
        source: |
          var authHeader = context.getVariable("request.header.Authorization");
          var rawToken = null;
          var tokenType = null;

          if (authHeader) {
            var authTrim = authHeader.trim();
            if (authTrim.indexOf("Bearer ") === 0) {
              rawToken = authTrim.substring(7).trim();
            } else {
              rawToken = authTrim;
            }

            if (rawToken) {
              if (rawToken.indexOf("ya29.") === 0) {
                tokenType = "google";
              } else if (rawToken.indexOf("eyJ") === 0) {
                tokenType = "microsoft";
              }
            }
          }

          if (rawToken && tokenType) {
            context.setVariable("token.raw_access_token", rawToken);
            context.setVariable("token.type", tokenType);
          }
  - name: LC-LookupTokenCache
    type: LookupCache
    content:
      lookupCache:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: LC-LookupTokenCache
        displayName: LC-LookupTokenCache
        properties: {}
        cacheKey:
          keyFragment:
            - value: external_token
            - metadata:
                ref: token.raw_access_token
        assignTo: token.cached_user
  - name: JS-ParseCachedUser
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseCachedUser
        displayName: JS-ParseCachedUser
        properties: {}
        source: |
          var cachedUserStr = context.getVariable("token.cached_user");
          if (cachedUserStr) {
            try {
              var cached = JSON.parse(cachedUserStr);
              if (cached.email) context.setVariable("token.email", cached.email);
              if (cached.type) context.setVariable("token.type", cached.type);
              if (cached.groups) context.setVariable("token.groups", cached.groups);
              if (cached.user_key) context.setVariable("token.user_key", cached.user_key);
              if (cached.api_key) context.setVariable("request.header.x-ai-key", cached.api_key);
              if (cached.group) context.setVariable("request.header.x-ai-group", cached.group);
              context.setVariable("token.valid", "true");
              context.setVariable("token.cached", "true");
              print("User info successfully restored from cache for " + cached.email);
            } catch (e) {
              print("Failed to parse cached user data: " + e);
            }
          }
  - name: SC-ValidateGoogleToken
    type: ServiceCallout
    content:
      serviceCallout:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: SC-ValidateGoogleToken
        displayName: SC-ValidateGoogleToken
        properties: {}
        request:
          variable: tokenInfoRequest
          ignoreUnresolvedVariables: "false"
        response: tokenInfoResponse
        httpTargetConnection:
          properties: {}
          url: https://oauth2.googleapis.com/tokeninfo?access_token={token.raw_access_token}
  - name: JS-ParseGoogleToken
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseGoogleToken
        displayName: JS-ParseGoogleToken
        properties: {}
        source: |
          var responseCode = context.getVariable("tokenInfoResponse.status.code");
          var responseContent = context.getVariable("tokenInfoResponse.content");

          if (responseCode == "200" && responseContent) {
            try {
              var tokenInfo = JSON.parse(responseContent);
              if (tokenInfo.email) context.setVariable("token.email", tokenInfo.email);
              if (tokenInfo.email_verified) context.setVariable("token.email_verified", tokenInfo.email_verified);
              if (tokenInfo.scope) context.setVariable("token.scope", tokenInfo.scope);
              if (tokenInfo.exp) context.setVariable("token.expires_in", tokenInfo.expires_in || tokenInfo.exp);
              if (tokenInfo.aud) context.setVariable("token.aud", tokenInfo.aud);
              if (tokenInfo.sub) context.setVariable("token.sub", tokenInfo.sub);
              if (tokenInfo.azp) context.setVariable("token.azp", tokenInfo.azp);
              context.setVariable("token.valid", "true");
              context.setVariable("user.groups_kvm_key", "groups." + tokenInfo.email);
            } catch (e) {
              context.setVariable("token.valid", "false");
              context.setVariable("response.status.code", 401);
              throw "Invalid Google OAuth Token Response";
            }
          } else {
            context.setVariable("token.valid", "false");
            context.setVariable("response.status.code", 401);
            throw "Invalid Google OAuth Token";
          }
  - name: VJ-VerifyEntraToken
    type: VerifyJWT
    content:
      verifyJwt:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: VJ-VerifyEntraToken
        displayName: VJ-VerifyEntraToken
        algorithm: RS256
        source: token.raw_access_token
        publicKey:
          jwks:
            metadata:
              uri: "{EntraJwksUri}"
  - name: JS-ParseEntraToken
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseEntraToken
        displayName: JS-ParseEntraToken
        properties: {}
        source: |
          var email = context.getVariable("jwt.VJ-VerifyEntraToken.claim.preferred_username") ||
                      context.getVariable("jwt.VJ-VerifyEntraToken.claim.upn") ||
                      context.getVariable("jwt.VJ-VerifyEntraToken.claim.email") ||
                      context.getVariable("jwt.VJ-VerifyEntraToken.claim.sub");

          if (email) {
            context.setVariable("token.email", email);
            context.setVariable("user.groups_kvm_key", "groups." + email);
            context.setVariable("token.valid", "true");
          } else {
            context.setVariable("token.valid", "false");
            context.setVariable("response.status.code", 401);
            throw "Invalid Microsoft Entra Token: No email or UPN claim found";
          }

          var groupsClaim = context.getVariable("jwt.VJ-VerifyEntraToken.claim.groups") ||
                            context.getVariable("jwt.VJ-VerifyEntraToken.claim.roles");

          if (groupsClaim) {
            var groupsStr = "";
            if (Array.isArray(groupsClaim)) {
              groupsStr = groupsClaim.join(",");
            } else if (typeof groupsClaim === "string") {
              groupsStr = groupsClaim;
            }
            if (groupsStr) {
              context.setVariable("token.groups", groupsStr);
            }
          }
  - name: KVM-GetUserKeyByEmail
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-GetUserKeyByEmail
          mapIdentifier: AI-Users
        displayName: KVM-GetUserKeyByEmail
        properties: {}
        get:
          metadata:
            assignTo: token.user_key
            index: "1"
          key:
            parameter:
              metadata:
                ref: token.email
        scope: environment
  - name: KVM-GetGroupsByEmail
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-GetGroupsByEmail
          mapIdentifier: AI-Users
        displayName: KVM-GetGroupsByEmail
        properties: {}
        get:
          metadata:
            assignTo: token.groups
            index: "1"
          key:
            parameter:
              metadata:
                ref: user.groups_kvm_key
        scope: environment
  - name: SC-GetGoogleGroups
    type: ServiceCallout
    content:
      serviceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-GetGoogleGroups
        displayName: SC-GetGoogleGroups
        properties: {}
        request:
          variable: groupsRequest
          ignoreUnresolvedVariables: "true"
        response: groupsResponse
        httpTargetConnection:
          properties: {}
          url: https://cloudidentity.googleapis.com/v1/groups/-/memberships:searchDirectGroups?query=member_key_id=='{token.email}'
          authentication:
            googleAccessToken:
              scopes:
                scope: https://www.googleapis.com/auth/cloud-identity.groups.readonly
  - name: JS-ParseGoogleGroups
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseGoogleGroups
        displayName: JS-ParseGoogleGroups
        properties: {}
        source: |
          var responseContent = context.getVariable("groupsResponse.content");
          if (responseContent) {
            try {
              var groupsData = JSON.parse(responseContent);
              var groupNames = [];
              if (groupsData.memberships) {
                for (var i = 0; i < groupsData.memberships.length; i++) {
                  var m = groupsData.memberships[i];
                  if (m.groupKey && m.groupKey.id) {
                    groupNames.push(m.groupKey.id);
                  }
                }
              }
              var groupsStr = groupNames.join(",");
              context.setVariable("token.groups", groupsStr);
              context.setVariable("token.groups_fetched", "true");
            } catch (e) {
              print("Failed to parse Google groups response: " + e);
            }
          }
  - name: SC-GetEntraGroups
    type: ServiceCallout
    content:
      serviceCallout:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: SC-GetEntraGroups
        displayName: SC-GetEntraGroups
        properties: {}
        request:
          variable: groupsRequest
          ignoreUnresolvedVariables: "true"
        response: groupsResponse
        httpTargetConnection:
          properties: {}
          url: https://graph.microsoft.com/v1.0/me/transitiveMemberOf?$select=id,displayName
  - name: JS-ParseEntraGroups
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "true"
          enabled: "true"
          timeLimit: "200"
          name: JS-ParseEntraGroups
        displayName: JS-ParseEntraGroups
        properties: {}
        source: |
          var responseContent = context.getVariable("groupsResponse.content");
          if (responseContent) {
            try {
              var groupsData = JSON.parse(responseContent);
              var groupNames = [];
              if (groupsData.value && Array.isArray(groupsData.value)) {
                for (var i = 0; i < groupsData.value.length; i++) {
                  var g = groupsData.value[i];
                  if (g.id) {
                    groupNames.push(g.id);
                  }
                  if (g.displayName) {
                    groupNames.push(g.displayName);
                  }
                }
              }
              var groupsStr = groupNames.join(",");
              if (groupsStr) {
                context.setVariable("token.groups", groupsStr);
                context.setVariable("token.groups_fetched", "true");
              }
            } catch (e) {
              print("Failed to parse Microsoft Graph groups response: " + e);
            }
          }
  - name: KVM-SaveGroupsByEmail
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: KVM-SaveGroupsByEmail
          mapIdentifier: AI-Users
        displayName: KVM-SaveGroupsByEmail
        properties: {}
        put:
          setValue:
            metadata:
              ref: token.groups
          key:
            parameter:
              metadata:
                ref: user.groups_kvm_key
        scope: environment
  - name: JS-ProcessUser
    type: Javascript
    content:
      javascript:
        metadata:
          continueOnError: "false"
          enabled: "true"
          timeLimit: "200"
          name: JS-ProcessUser
        displayName: JS-ProcessUser
        properties: {}
        source: |
          var userKey = context.getVariable("token.user_key");
          var resolvedKey = null;
          var matchedGroup = null;

          if (userKey && userKey.trim() !== "") {
            resolvedKey = userKey.trim();
            print("Found direct user key for email, using as x-ai-key...");
          } else {
            var groupData = context.getVariable("token.groups");
            if (groupData) {
              var groupArray = groupData.split(",");
              var groupCredentials = context.getVariable("ai.groups");
              if (groupCredentials) {
                try {
                  var groupCredentialsObject = JSON.parse(groupCredentials);
                  for (var i = 0; i < groupArray.length; i++) {
                    var grp = groupArray[i].trim();
                    if (groupCredentialsObject[grp]) {
                      resolvedKey = groupCredentialsObject[grp];
                      matchedGroup = grp;
                      print("Found group credential, setting as header...");
                      break;
                    }
                  }
                } catch(e) {
                  print("Error parsing group credential data: " + e);
                }
              }
              if (!matchedGroup && groupArray.length > 0 && groupArray[0].trim() !== "") {
                matchedGroup = groupArray[0].trim();
              }
            }
          }

          if (!matchedGroup) {
            var emailVal = context.getVariable("token.email");
            if (emailVal) matchedGroup = emailVal;
          }

          if (resolvedKey) {
            context.setVariable("request.header.x-ai-key", resolvedKey);
          }
          if (matchedGroup) {
            context.setVariable("request.header.x-ai-group", matchedGroup);
          }

          var email = context.getVariable("token.email") || "";
          var tokenType = context.getVariable("token.type") || "";
          var groups = context.getVariable("token.groups") || "";
          var userKeyVal = context.getVariable("token.user_key") || "";
          var apiKey = context.getVariable("request.header.x-ai-key") || "";
          var groupHeader = context.getVariable("request.header.x-ai-group") || "";

          var cacheObject = {
            email: email,
            type: tokenType,
            groups: groups,
            user_key: userKeyVal,
            api_key: apiKey,
            group: groupHeader
          };
          context.setVariable("token.cached_user", JSON.stringify(cacheObject));
          print("Prepared cached_user payload for token cache: " + JSON.stringify(cacheObject));
  - name: PC-PopulateTokenCache
    type: PopulateCache
    content:
      populateCache:
        metadata:
          continueOnError: "true"
          enabled: "true"
          name: PC-PopulateTokenCache
        displayName: PC-PopulateTokenCache
        properties: {}
        cacheKey:
          keyFragment:
            - value: external_token
            - metadata:
                ref: token.raw_access_token
        source: token.cached_user
        expirySettings:
          timeoutInSec: "3600"
  - name: KVM-LoadConfig
    type: KeyValueMapOperations
    content:
      keyValueMapOperations:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: KVM-LoadConfig
          mapIdentifier: AI-Config
        displayName: KVM-LoadConfig
        properties: {}
        exclusiveCache: "false"
        expiryTimeInSecs: "10"
        get:
          - metadata:
              assignTo: ai.failoverModel
            key:
              parameter: FailoverModel
          - metadata:
              assignTo: ai.prices
            key:
              parameter: PriceList
          - metadata:
              assignTo: ai.groupsLookup
            key:
              parameter: GroupsLookup
          - metadata:
              assignTo: ai.groups
              index: "1"
            key:
              parameter: Groups
        scope: environment
resources: []
tests: []
