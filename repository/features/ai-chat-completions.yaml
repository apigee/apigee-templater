name: ai-chat-completions
displayName: OpenAI Chat Completions API Proxy
type: feature
description: Feature for the OpenAI Chat Completions API
documentation: ""
categories: []
parameters: []
endpoints:
  - name: completions
    basePath: /v1/chat/completions
    routes:
      - name: route-googlecloud
        target: googlecloud
        condition: target.route = "googlecloud"
      - name: route-googlecloud-oai
        target: googlecloud-oai
        condition: target.route = "googlecloud-oai"
      - name: route-openai
        target: openai
        condition: target.route = "openai"
      - name: route-anthropic
        target: anthropic
        condition: target.route = "anthropic"
      - name: default
        target: googlecloud
    flows:
      - name: PreFlow
        mode: Request
        steps:
          - name: OAS-Validation
    faultRules: []
targets:
  - name: anthropic
    url: https://api.anthropic.com
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://api.anthropic.com
  - name: googlecloud-oai
    url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/endpoints/openapi/chat/completions
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/endpoints/openapi/chat/completions
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://aiplatform.googleapis.com/v1/projects/{ai.googleCloudProject}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
  - name: openai
    url: https://api.openai.com
    flows: []
    faultRules: []
    httpTargetConnection:
      properties: {}
      url: https://api.openai.com
policies:
  - name: OAS-Validation
    type: OASValidation
    content:
      oasValidation:
        metadata:
          continueOnError: "false"
          enabled: "true"
          name: OAS-Validation
        displayName: OAS-Validation
        properties: {}
        options:
          validateMessageBody: true
        oasResource: oas://openapi.yaml
resources:
  - name: openapi.yaml
    type: oas
    content: |
      openapi: 3.0.0
      info:
        title: OpenAI Chat Completions API
        description: Basic request structure validation for OpenAI Chat Completions API.
        version: 1.0.0
      paths:
        /:
          post:
            summary: Create chat completion
            requestBody:
              required: true
              content:
                application/json:
                  schema:
                    type: object
                    required:
                      - model
                      - messages
                    additionalProperties: false
                    properties:
                      model:
                        type: string
                      messages:
                        type: array
                        items:
                          type: object
                          required:
                            - role
                            - content
                          additionalProperties: false
                          properties:
                            role:
                              type: string
                            content:
                              nullable: true
                              oneOf:
                                - type: string
                                - type: array
                                  items:
                                    type: object
                            name:
                              type: string
                            tool_calls:
                              type: array
                              items:
                                type: object
                            tool_call_id:
                              type: string
                      temperature:
                        type: number
                      top_p:
                        type: number
                      n:
                        type: integer
                      stream:
                        type: boolean
                      stop:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                      max_tokens:
                        type: integer
                      presence_penalty:
                        type: number
                      frequency_penalty:
                        type: number
                      logit_bias:
                        type: object
                      user:
                        type: string
                      tools:
                        type: array
                        items:
                          type: object
                      tool_choice:
                        oneOf:
                          - type: string
                          - type: object
                      response_format:
                        type: object
                      seed:
                        type: integer
                      service_tier:
                        type: string
            responses:
              "200":
                description: Successful response
tests: []
