name: REST-AI-ModelArmor-v1
type: template
description: API template for REST-AI-ModelArmor-v1
features:
  - ../features/ai-proxy-googlecloud.yaml
  - ../features/ai-modelarmor.yaml
parameters:
  - name: BasePath
    paths:
      - $.endpoints[:1].basePath
    description: The base path to offer the proxy on.
    default: /modelarmor
  - name: ModelArmorTemplate
    description: The Model Armor template name. The project is taken from the Apigee
      organization, and the location from the ModelArmorLocation parameter.
    default: default-ma-template
    examples:
      - default-ma-template
      - ma-template1
  - name: ModelArmorLocation
    default: eu
    examples:
      - eu
      - us
      - europe-west1
    maps: {}
endpoints:
  - name: googlecloud
    basePath: /modelgarden
    routes:
      - name: googlecloud
        target: googlecloud
targets:
  - name: googlecloud
    url: https://aiplatform.googleapis.com
