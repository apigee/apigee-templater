name: REST-AI-Audio-Transcriptions-v1
type: template
description: API template for REST-AI-Audio-Transcriptions-v1
features:
  - ../features/ai-audio-transcriptions.yaml
  - ../features/ai-auth.yaml
  - ../features/auth-external-token.yaml
parameters:
  - name: ModelRouting
    displayName: ModelRouting
    description: Configuration input for ModelRouting
    default: "true"
    examples: []
    maps: {}
  - name: ModelRoutingKey
    displayName: ModelRoutingKey
    description: Configuration input for ModelRoutingKey
    default: ModelRouting
    examples: []
    maps: {}
  - name: EntraJwksUri
    displayName: Entra JwksUri
    description: Configuration input for Microsoft Entra ID JWKS URI.
    default: https://login.microsoftonline.com/common/discovery/v2.0/keys
endpoints:
  - name: transcriptions
    basePath: /v1/audio/transcriptions
    routes:
      - name: openai
        target: openai
        condition: target.route = "openai"
      - name: googlecloud
        target: googlecloud
targets:
  - name: googlecloud
    url: https://aiplatform.googleapis.com/v1beta1/projects/{organization.name}/locations/global/publishers/{ai.provider}/models/{ai.model}:{ai.method}
  - name: openai
    url: https://api.openai.com/v1/audio/speech
