name: REST-AI-Presidio-v1
type: template
description: API template for REST-AI-Presidio-v1
features:
  - ../features/ai-proxy-googlecloud.yaml
  - ../features/ai-presidio.yaml
parameters:
  - name: BasePath
    paths:
      - $.endpoints[:1].basePath
    description: The base path to offer the proxy on.
    default: /presidio
    examples:
      - /llm
      - /models
  - name: ModelRouting
    displayName: ModelRouting
    description: Configuration input for ModelRouting
    default: "false"
endpoints:
  - name: googlecloud
    basePath: /modelgarden
    routes:
      - name: googlecloud
        target: googlecloud
targets:
  - name: googlecloud
    url: https://aiplatform.googleapis.com
