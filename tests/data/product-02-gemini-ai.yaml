# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: gemini-ai-developer-product
displayName: Gemini AI Developer Product
type: product
description: Developer tier for generative AI chat completions, embeddings, and tool orchestration
access: public
approvalType: auto
environments:
  - eval
  - prod
proxies:
  - gemini-ai-gateway-v1
quota: "50000"
quotaInterval: "1"
quotaTimeUnit: month
attributes:
  - name: ai.quota.tokens
    value: "1000000"
llmOperations:
  - name: /v1/ai/chat/completions
    apiSource: gemini-ai-gateway-v1
    model: gemini-1.5-pro
    methods:
      - POST
    quota:
      limit: "60"
      interval: "1"
      timeUnit: minute
  - name: /v1/ai/embeddings
    apiSource: gemini-ai-gateway-v1
    model: text-embedding-004
    methods:
      - POST
payloadOperations:
  - name: tools/list
    apiSource: gemini-ai-gateway-v1
    protocol: MCP
    quota:
      limit: "300"
      interval: "1"
      timeUnit: minute
  - name: tools/call
    apiSource: gemini-ai-gateway-v1
    protocol: MCP
    attributes:
      - name: tool
        value: get_weather
    quota:
      limit: "60"
      interval: "1"
      timeUnit: minute
  - name: tools/call
    apiSource: gemini-ai-gateway-v1
    protocol: MCP
    attributes:
      - name: tool
        value: search_docs
    quota:
      limit: "30"
      interval: "1"
      timeUnit: minute
