# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: deployment-1
type: deployment
proxies:
  - name: TestProxy
    displayName: Hello World Proxy
    type: proxy
    gateway: apigee
    schemaVersion: 1.0.0
    categories: []
    description: API proxy for HelloWorld-v1
    documentation: ""
    parameters:
      - name: response-helloworld.helloworld.MESSAGE
        displayName: MESSAGE
        description: Configuration input for MESSAGE
        default: Hello world!
        examples:
          - Hello mars!
          - Hello internet!
    endpoints:
      - name: default
        basePath: /testproxy
        routes:
          - name: default
            target: default
        flows:
          - name: PostFlow
            mode: Response
            steps:
              - name: JS-AddHelloWorld
              - name: AM-SetHeader
        faultRules: []
    targets:
      - name: default
        url: https://mocktarget.apigee.net
        flows: []
        faultRules: []
        httpTargetConnection:
          Properties: {}
          URL: https://mocktarget.apigee.net
    policies:
      - name: AM-SetHeader
        type: AssignMessage
        content:
          AssignMessage:
            metadata:
              continueOnError: "false"
              enabled: "true"
              name: AM-SetHeader
            DisplayName: AM-SetHeader
            Properties: {}
            Set:
              Headers:
                Header:
                  metadata:
                    name: x-testheader
                  _text: "{propertyset.helloworld.MESSAGE}"
              Path: {}
            IgnoreUnresolvedVariables: "true"
            AssignTo:
              metadata:
                createNew: "false"
                transport: http
                type: response
      - name: JS-AddHelloWorld
        type: Javascript
        content:
          Javascript:
            metadata:
              continueOnError: "false"
              enabled: "true"
              timeLimit: "200"
              name: JS-AddHelloWorld
            DisplayName: JS-AddHelloWorld
            Properties: {}
            ResourceURL: jsc://hello-world.js
    resources:
      - name: helloworld.properties
        type: properties
        content: |
          MESSAGE=Hello world!
      - name: hello-world.js
        type: jsc
        content: |-
          var responseText = response.content;
          if (!responseText) responseText = "";

          var responseObject = undefined;

          try {
            responseObject = JSON.parse(responseText);
          } catch(e) {
            print("Could not parse JSON.");
          }

          var message = context.getVariable("request.queryparam.message");
          if (!message)
            message = context.getVariable("propertyset.helloworld.MESSAGE");
          if (!message)
            message = "Hello world!";

          if (responseObject) {
            responseObject["message"] = message;
            context.setVariable("response.content", JSON.stringify(responseObject));
          } else {
            responseText = responseText + " " + message;
            context.setVariable("response.content", responseText);
          }
products:
- name: test-product
  displayName: Test Product
  type: product
  gateway: apigee
  schemaVersion: 1.0.0
  description: Test Product
  access: public
  approvalType: auto
  environments:
    - default-dev
  proxies:
    - TestProxy
  apiResources: []
  quota: "50000"
  quotaInterval: "1"
  quotaTimeUnit: month
  scopes: []
  operations:
    - apiSource: TestProxy
      operations:
        - name: /json
          methods: []
      quota:
        limit: "5"
        interval: "1"
        timeUnit: minute
  llmOperations: []
  payloadOperations: []
  graphqlOperations: []
  grpcOperations: []
users:
- name: test@example.com
  displayName: ""
  type: user
  gateway: apigee
  schemaVersion: 1.0.0
  email: test@example.com
  firstName: Test
  lastName: User
  userName: test@example.com
  status: active
  attributes: []
  apps:
    - name: Test App
      displayName: Test App
      description: ""
      callbackUrl: ""
      status: approved
      products:
        - test-product
      scopes: []
      attributes: []
      credentials:
        - consumerKey: test-app-key-123
          consumerSecret: test-app-secret-123
          status: approved
          issuedAt: "1788775511054"
          expiresAt: "-1"
          products:
            - test-product
          scopes: []
          attributes: []
tests:
  - name: testproxy-test1
    proxy: TestProxy
    path: /testproxy
    method: GET
    headers:
      x-api-key: test-api-key-12345
    assertions:
      - status.code == 200
