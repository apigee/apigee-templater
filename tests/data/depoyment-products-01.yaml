# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: deployment-sample
type: deployment
products:
- name: mcp-package
  displayName: MCP Package
  type: product
  gateway: apigee
  schemaVersion: 1.0.0
  description: Starter tier for MCP & LLM Model access.
  access: public
  approvalType: auto
  environments:
    - default-dev
  proxies:
    - MCP-CustomerService
  apiResources: []
  quota: "50000"
  quotaInterval: "1"
  quotaTimeUnit: month
  scopes: []
  operations: []
  llmOperations: []
  payloadOperations:
    - apiSource: MCP-CustomerService
      protocol: MCP
      operations:
        - name: tools/list
    - apiSource: MCP-CustomerService
      protocol: MCP
      operations:
        - name: tools/call/list_customers
      quota:
        limit: "10"
        interval: "1"
        timeUnit: minute
  graphqlOperations: []
  grpcOperations: []
- name: ai-starter-package
  displayName: AI Starter Package
  type: product
  gateway: apigee
  schemaVersion: 1.0.0
  description: Starter tier for MCP & LLM Model access.
  access: public
  approvalType: auto
  environments:
    - default-dev
  proxies:
    - REST-Orders
    - REST-AI-Completions
    - REST-AI-Messages
    - REST-AI-Interactions
    - REST-AI-GenerateContent
    - REST-AI-Embeddings
  apiResources: []
  quota: "50000"
  quotaInterval: "1"
  quotaTimeUnit: month
  scopes: []
  operations:
    - apiSource: REST-Orders
      operations:
        - name: /json
          methods: []
      quota: {}
  llmOperations:
    - apiSource: REST-AI-Completions
      operations:
        - name: /
          methods:
            - POST
          model: glm-5.2-maas
      llmTokenQuota:
        limit: "100"
        interval: "1"
        timeUnit: minute
    - apiSource: REST-AI-Completions
      operations:
        - name: /
          methods:
            - POST
          model: gemini-3.8-flash
      llmTokenQuota:
        limit: "10000"
        interval: "1"
        timeUnit: minute
    - apiSource: REST-AI-Completions
      operations:
        - name: /
          methods:
            - POST
          model: gemini-3.5-flash-lite
      llmTokenQuota: {}
    - apiSource: REST-AI-Completions
      operations:
        - name: /
          methods:
            - POST
          model: claude-sonnet-5
      llmTokenQuota:
        limit: "10000"
        interval: "1"
        timeUnit: hour
    - apiSource: REST-AI-Completions
      operations:
        - name: /
          methods:
            - POST
          model: claude-opus-5
      llmTokenQuota:
        limit: "1000"
        interval: "1"
        timeUnit: hour
    - apiSource: REST-AI-Messages
      operations:
        - name: /
          methods:
            - POST
          model: claude-opus-5
    - apiSource: REST-AI-Messages
      operations:
        - name: /
          methods:
            - POST
          model: claude-sonnet-5
    - apiSource: REST-AI-Messages
      operations:
        - name: /
          methods:
            - POST
          model: claude-haiku-4.5
    - apiSource: REST-AI-Interactions
      operations:
        - name: /
          methods:
            - POST
          model: gemini-3.5-flash-lite
        - name: /
          methods:
            - POST
          model: gemini-3.8-flash
      llmTokenQuota: {}
    - apiSource: REST-AI-GenerateContent
      operations:
        - name: /
          methods:
            - POST
          model: gemini-3.5-flash-lite
        - name: /
          methods:
            - POST
          model: gemini-3.8-flash
      llmTokenQuota: {}
    - apiSource: REST-AI-Embeddings
      operations:
        - name: /
          methods:
            - POST
          model: google/gemini-embedding-2
      llmTokenQuota: {}
  payloadOperations: []
  graphqlOperations: []
  grpcOperations: []
