# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: mcp-customer-service-product
displayName: MCP Customer Service Product
type: product
description: Model Context Protocol (MCP) tool server product for AI agents with granular per-tool quotas
approvalType: auto
environments:
  - dev
  - prod
proxies:
  - MCP-CustomerService
quota: "100000"
quotaInterval: "1"
quotaTimeUnit: month
attributes:
  - name: access
    value: internal
payloadOperations:
  - name: tools/list
    apiSource: MCP-CustomerService
    protocol: MCP
    quota:
      limit: "500"
      interval: "1"
      timeUnit: minute
  - name: tools/call
    apiSource: MCP-CustomerService
    protocol: MCP
    attributes:
      - name: tool
        value: lookup_customer
    quota:
      limit: "100"
      interval: "1"
      timeUnit: minute
  - name: tools/call
    apiSource: MCP-CustomerService
    protocol: MCP
    attributes:
      - name: tool
        value: create_support_ticket
    quota:
      limit: "20"
      interval: "1"
      timeUnit: minute
  - name: tools/call
    apiSource: MCP-CustomerService
    protocol: MCP
    attributes:
      - name: tool
        value: refund_order
    quota:
      limit: "5"
      interval: "1"
      timeUnit: minute
  - name: resources/list
    apiSource: MCP-CustomerService
    protocol: MCP
    quota:
      limit: "200"
      interval: "1"
      timeUnit: minute
  - name: resources/read
    apiSource: MCP-CustomerService
    protocol: MCP
    quota:
      limit: "200"
      interval: "1"
      timeUnit: minute
  - name: prompts/list
    apiSource: MCP-CustomerService
    protocol: MCP
    quota:
      limit: "100"
      interval: "1"
      timeUnit: minute
