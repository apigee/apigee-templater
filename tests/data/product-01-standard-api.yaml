# yaml-language-server: $schema=https://raw.githubusercontent.com/apigee/apigee-templater/main/schema/gateway.schema.1.0.json
gateway: apigee
schemaVersion: 1.0.0
name: standard-api-product
displayName: Standard Public API Product
type: product
description: Self-service access to public weather and core microservices with monthly rate limiting
approvalType: auto
environments:
  - eval
  - dev
  - test
proxies:
  - weather-api-v1
  - mock-echo-service-v1
quota: "10000"
quotaInterval: "1"
quotaTimeUnit: month
attributes:
  - name: access
    value: public
  - name: ratelimit.category
    value: standard
operations:
  - apiSource: weather-api-v1
    operations:
      - name: /v1/weather/current
        methods:
          - GET
      - name: /v1/weather/forecast
        methods:
          - GET
        quota:
          limit: "500"
          interval: "1"
          timeUnit: hour
  - apiSource: mock-echo-service-v1
    operations:
      - name: /v1/mock-echo
        methods:
          - GET
          - POST
