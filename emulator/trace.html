<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apigee Emulator Trace Visualizer</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #475569;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    input[type="file"] {
      display: none;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    .message-list {
      flex: 1;
      overflow-y: auto;
    }

    .message-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }

    .message-item:hover {
      background: var(--bg-card);
    }

    .message-item.active {
      background: var(--bg-card);
      border-left: 4px solid var(--accent);
    }

    .msg-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .badge-200 { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .badge-400, .badge-500 { background: rgba(239, 68, 68, 0.2); color: var(--error); }

    .msg-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-all;
    }

    .msg-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .timeline {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .step-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .step-card.error {
      border-color: var(--error);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .step-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }

    .step-id {
      font-size: 0.75rem;
      background: var(--bg-card);
      padding: 2px 8px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .properties-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.8rem;
    }

    .properties-table th, .properties-table td {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }

    .properties-table th {
      color: var(--text-muted);
    }

    .vars-list {
      margin-top: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      background: var(--bg-primary);
      padding: 8px;
      border-radius: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .var-action { color: var(--accent); font-weight: bold; }
    .var-name { color: #f472b6; }
    .var-val { color: #a7f3d0; word-break: break-all; }

    .content-box {
      background: var(--bg-primary);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.8rem;
      white-space: pre-wrap;
      max-height: 250px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .drop-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      border: 2px dashed var(--border);
      margin: 20px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<header>
  <div class="title">Apigee Emulator Trace Visualizer</div>
  <div class="controls">
    <label class="btn" for="fileInput">Open trace.json</label>
    <input type="file" id="fileInput" accept=".json">
  </div>
</header>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-header">Requests (<span id="reqCount">0</span>)</div>
    <div class="message-list" id="messageList"></div>
  </div>

  <div class="main-view" id="mainView">
    <div class="drop-zone" id="dropZone">
      <p>Select or drag & drop a <strong>trace.json</strong> file to inspect execution flow, variables, and policy steps.</p>
    </div>
  </div>
</div>

<script>
  let traceData = null;

  document.getElementById('fileInput').addEventListener('change', handleFile);

  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length) {
      loadJSON(e.dataTransfer.files[0]);
    }
  });

  function handleFile(e) {
    if (e.target.files.length) {
      loadJSON(e.target.files[0]);
    }
  }

  // Attempt auto-loading trace.json if served alongside or in dist/
  fetch('dist/trace.json')
    .then(r => r.ok ? r.json() : fetch('trace.json').then(res => res.ok ? res.json() : null))
    .then(data => { if (data) renderTrace(data); })
    .catch(() => {});

  function loadJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const json = JSON.parse(e.target.result);
        renderTrace(json);
      } catch (err) {
        alert('Invalid JSON file: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function renderTrace(data) {
    traceData = data;
    const messages = data.Messages || [];
    document.getElementById('reqCount').innerText = messages.length;

    const list = document.getElementById('messageList');
    list.innerHTML = '';

    messages.forEach((msg, idx) => {
      const firstReq = msg.point.find(p => p.id === 'StateChange' && p.results && p.results.some(r => r.verb));
      const lastResp = msg.point.slice().reverse().find(p => p.id === 'StateChange' && p.results && p.results.some(r => r.statusCode));

      let verb = 'REQ';
      let uri = 'Execution';
      let status = '---';

      if (firstReq) {
        const r = firstReq.results.find(res => res.verb);
        if (r) { verb = r.verb; uri = r.uRI; }
      }

      if (lastResp) {
        const r = lastResp.results.find(res => res.statusCode);
        if (r) status = r.statusCode;
      }

      const item = document.createElement('div');
      item.className = 'message-item' + (idx === 0 ? ' active' : '');
      item.innerHTML = `
        <span class="msg-badge ${status.startsWith('2') ? 'badge-200' : 'badge-400'}">${status}</span>
        <div class="msg-title">${verb} ${uri}</div>
        <div class="msg-time">Request #${idx + 1}</div>
      `;
      item.onclick = () => {
        document.querySelectorAll('.message-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        renderMessageDetails(msg);
      };
      list.appendChild(item);
    });

    if (messages.length > 0) {
      renderMessageDetails(messages[0]);
    }
  }

  function renderMessageDetails(msg) {
    const mainView = document.getElementById('mainView');
    mainView.innerHTML = '<div class="timeline" id="timeline"></div>';
    const timeline = document.getElementById('timeline');

    msg.point.forEach(pt => {
      if (!pt.results || pt.results.length === 0) return;

      const card = document.createElement('div');
      card.className = 'step-card';

      let stepName = pt.id;
      let properties = [];
      let varAccess = [];
      let content = null;

      pt.results.forEach(res => {
        if (res.properties && res.properties.property) {
          properties.push(...res.properties.property);
        }
        if (res.ActionResult === 'VariableAccess' && res.accessList) {
          varAccess.push(...res.accessList);
        }
        if (res.content) {
          content = res.content;
        }
      });

      const dispNameProp = properties.find(p => p.name === 'stepDefinition-displayName' || p.name === 'From');
      if (dispNameProp) stepName += `: ${dispNameProp.value}`;

      let propsHTML = '';
      if (properties.length > 0) {
        propsHTML = `
          <table class="properties-table">
            <thead><tr><th>Property</th><th>Value</th></tr></thead>
            <tbody>
              ${properties.map(p => `<tr><td>${p.name}</td><td>${escapeHtml(p.value)}</td></tr>`).join('')}
            </tbody>
          </table>
        `;
      }

      let varsHTML = '';
      if (varAccess.length > 0) {
        varsHTML = `
          <div class="vars-list">
            ${varAccess.map(v => {
              const op = Object.keys(v)[0];
              const info = v[op];
              return `<div><span class="var-action">${op.toUpperCase()}</span> <span class="var-name">${info.name}</span> = <span class="var-val">${escapeHtml(info.value || '')}</span></div>`;
            }).join('')}
          </div>
        `;
      }

      let contentHTML = '';
      if (content) {
        contentHTML = `<div class="content-box">${escapeHtml(content)}</div>`;
      }

      card.innerHTML = `
        <div class="step-header">
          <span class="step-name">${stepName}</span>
          <span class="step-id">${pt.id}</span>
        </div>
        ${propsHTML}
        ${varsHTML}
        ${contentHTML}
      `;

      timeline.appendChild(card);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
